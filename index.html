<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hello I see you</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #e8e8e8;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 3s ease forwards;
      opacity: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: #e8e8e8;
      margin-left: 8px;
      vertical-align: middle;
      animation: blink 1.1s infinite;
    }

    .subtle {
      margin-top: 25px;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #555;
      animation: appear 5s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes appear {
      0%, 45% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 45% {
        opacity: 1;
      }

      46%, 100% {
        opacity: 0;
      }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.025),
          transparent 55%
        );
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>
      Hello I see you<span class="cursor"></span>
    </h1>

    <div class="subtle">
      welcome
    </div>
  </main>

</body>
</html>
